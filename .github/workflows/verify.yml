name: Verify website and Swim Resources
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run verify
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cutter-coach
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: velocity-v2
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-cutter-coach.appspot.com
      - run: npm install --global firebase-tools@15.30.2
      - run: npm run test:rules
      - name: Report retained website dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        # Existing Next/Sanity findings are recorded in docs/swim-resources/MIGRATION.md.
        # Framework upgrades are outside this migration's preserved-version scope.
