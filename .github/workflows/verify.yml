name: Verify Velocity Swimming
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: npm run seed:local
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: |
          npm run dev:local > /tmp/velocity-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3001/tools > /dev/null && break
            sleep 1
          done
          node scripts/unified/import-fixture.mjs
          npm run test:browser
          npm run test:collection:browser
      - name: Check database advisors
        run: supabase db advisors --local --type all --fail-on error
      - name: Stop local services
        if: always()
        run: supabase stop
