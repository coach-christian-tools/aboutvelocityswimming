name: Verify Workshare
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  workshare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/workshare/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix firebase/workshare/functions
      - run: npm run verify:workshare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workshare:emulators
